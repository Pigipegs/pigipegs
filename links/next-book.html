<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nächstes Pigipegs-Abenteuer</title>
<style>
:root{--bg1:#fff7fb;--bg2:#f4fbff;--text:#1f2937;--muted:#6b7280;--brand:#ff8faa;--brand2:#5b8cff;--card:#ffffffcc;--shadow:0 10px 30px rgba(0,0,0,.08);--radius:18px}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:radial-gradient(900px 520px at 20% 0%,#ffd1ea 0%,transparent 55%),radial-gradient(800px 520px at 90% 10%,#cfe6ff 0%,transparent 50%),linear-gradient(180deg,var(--bg1),var(--bg2));min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px}.card{background:var(--card);border:1px solid #fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}.muted{color:var(--muted);line-height:1.7}.btn{display:inline-block;margin-top:14px;padding:12px 16px;border-radius:14px;text-decoration:none;font-weight:800;background:linear-gradient(135deg,var(--brand),var(--brand2));color:white}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🌙 Das nächste Pigipegs-Abenteuer</h1>
    <p class="muted">Die Pigipegs-Welt wächst weiter. Hier entsteht später der Hinweis auf das nächste Buch und die nächste Hörwelt.</p>
    <p class="muted">Bis dahin findest du Buch 1, die Hörwelt und die Ausmalwelt auf der Pigipegs-Seite.</p>
    <a class="btn" href="/">Zurück zur Startseite</a>
  </div>
</div>
</body>
</html>
